test-log = { version = "0.2.18", features = ["trace"] }
thiserror = "2"
tokio = "1.48.0"
tokio-util = "0.7.17"
toml = "1.0.0"
tracing = "0.1.43"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "serde"] }
ts-rs = { version = "12.0.0" }
tui-term = "0.3.1"
twox-hash = "2.1.1"
uuid = "1.18.1"
vec1 = "1.12.1"
vt_fs_fingerprint = { path = "crates/vt_fs_fingerprint" }
vt_glob = { path = "crates/vt_glob" }
vt_graph_ser = { path = "crates/vt_graph_ser" }
vt_path = { path = "crates/vt_path" }
vt_powershell = { path = "crates/vt_powershell" }
vt_select = { path = "crates/vt_select" }
vt_shell = { path = "crates/vt_shell" }
vt_str = { path = "crates/vt_str" }
vt = { path = "crates/vt" }
