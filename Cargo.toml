[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
authors = ["Vite+ Authors"]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.89.0"

[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "warn"
non_ascii_idents = "warn"
unit-bindings = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)'] }
tail_expr_drop_order = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"
long_running_const_eval = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# restriction
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
# The task scheduling workflow is a single-threaded async task, so Send bounds are unnecessary.
future_not_send = "allow"

[workspace.dependencies]
allocator-api2 = { version = "0.2", default-features = false }
anstream = "1.0.0"
anyhow = "1.0.103"
assert2 = "0.4.0"
assertables = "10.0.0"
async-trait = "0.1.89"
base64 = "0.22.1"
wincode = "0.6.0"
bindgen = "0.72.1"
bitflags = "2.10.0"
brush-parser = "0.4.0"
bstr = { version = "1.12.0", default-features = false }
bump-scope = { version = "2", default-features = false, features = ["allocator-api2-02"] }
bumpalo = { version = "3.17.0", features = ["collections"] }
bytemuck = { version = "1.23.0", features = ["extern_crate_alloc", "must_cast"] }
cargo-platform = "=0.3.2"
cc = "1.2.39"
clap = "4.5.53"
color-eyre = "0.6.5"
compact_str = "0.9.0"
constcat = "0.6.1"
copy_dir = "0.1.3"
cow-utils = "0.1.3"
cp_r = "0.5.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
csv-async = { version = "1.3.1", features = ["tokio"] }
ctor = "1.0"
ctrlc = "3.5.2"
derive_more = "2.0.1"
diff-struct = "0.5.3"
directories = "6.0.0"
elf = { version = "0.8.0", default-features = false }
materialized_artifact = { path = "crates/materialized_artifact" }
materialized_artifact_macros = { path = "crates/materialized_artifact_macros" }
flate2 = "1.0.35"
fspy = { path = "crates/fspy" }
