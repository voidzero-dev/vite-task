vt_graph = { path = "crates/vt_graph" }
vt_ipc_shared = { path = "crates/vt_ipc_shared" }
vt_plan = { path = "crates/vt_plan" }
vt_server = { path = "crates/vt_server" }
vt_workspace = { path = "crates/vt_workspace" }
