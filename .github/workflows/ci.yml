name: CI

permissions:
  # Doing it explicitly because the default permission only includes metadata: read.
  contents: read

on:
  workflow_dispatch:
  pull_request:
    # `labeled` reruns CI when a pull request gets the `ci: full` label, which
    # adds the jobs that pull requests otherwise skip.
    types: [opened, synchronize, labeled]
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

defaults:
  run:
    shell: bash

jobs:
  detect-changes:
    runs-on: namespace-profile-linux-x64-default
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code-changed: ${{ steps.filter.outputs.code }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'

  clippy:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    name: Clippy
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Update submodules
        run: git submodule update --init --recursive

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: clippy
          components: clippy

      - run: rustup target add x86_64-unknown-linux-musl
      - run: pipx install cargo-zigbuild
      # pipx isolates cargo-zigbuild in its own venv, so its ziglang dependency
      # (which bundles zig) isn't on PATH. Install zig separately.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      # --locked: verify Cargo.lock is up to date (replaces the removed `cargo check --locked`)
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    name: Test (${{ matrix.shard }})
    env:
      # The steps, shared with `test-macos-x64`, read these instead of `matrix`.
      TEST_TARGET: ${{ matrix.target }}
      TEST_CARGO_CMD: ${{ matrix.cargo_cmd }}
      TEST_BUILD_TARGET: ${{ matrix.build_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: namespace-profile-linux-x64-default
            target: x86_64-unknown-linux-gnu
            cargo_cmd: cargo-zigbuild
            build_target: x86_64-unknown-linux-gnu.2.17
            shard: linux-gnu
          - os: namespace-profile-mac-default
            target: aarch64-apple-darwin
            cargo_cmd: cargo
            build_target: aarch64-apple-darwin
            shard: macos-arm64
          - os: namespace-profile-windows-4c-8g
            target: x86_64-pc-windows-msvc
            cargo_cmd: cargo
            build_target: x86_64-pc-windows-msvc
            shard: windows
    runs-on: ${{ matrix.os }}
    steps: &test-steps
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Update submodules
        run: git submodule update --init --recursive

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' || env.TEST_TARGET == 'x86_64-pc-windows-msvc' }}
          cache-key: test

      - run: rustup target add $TEST_TARGET

      - run: rustup target add x86_64-unknown-linux-musl
        if: env.TEST_TARGET == 'x86_64-unknown-linux-gnu'

      - run: pipx install cargo-zigbuild
        if: env.TEST_TARGET == 'x86_64-unknown-linux-gnu'

      # pipx isolates cargo-zigbuild in its own venv, so its ziglang dependency
      # (which bundles zig) isn't on PATH. Install zig separately.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: env.TEST_TARGET == 'x86_64-unknown-linux-gnu'

      - name: Build tests
        run: $TEST_CARGO_CMD test --no-run --target $TEST_BUILD_TARGET

      # Default `cargo test` runs only tests that need nothing beyond the
      # Rust toolchain; this step verifies that contract before Node.js
      # and pnpm enter the picture.
      - name: Run tests
        run: $TEST_CARGO_CMD test --target $TEST_BUILD_TARGET

      # x86_64-apple-darwin runs on arm64 runner under Rosetta; install x64 Node
      # so fspy's x86_64 preload dylib can be injected into spawned node procs.
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        with:
          architecture: ${{ env.TEST_TARGET == 'x86_64-apple-darwin' && 'x64' || '' }}

      - name: Install runtime binaries
        run: |
          if [[ "$TEST_TARGET" == 'x86_64-apple-darwin' ]]; then
            # Bun normally prefers the native arm64 binary under Rosetta, but
            # this job needs x64 Bun so the x64 preload dylib can be injected.
            PATH="$(dirname "$(command -v node)"):$PNPM_HOME:/usr/bin:/bin" \
              pnpm --filter vite-task-tools rebuild --pending
          else
            pnpm --filter vite-task-tools rebuild --pending
          fi

      - name: Install Chromium system dependencies
        if: env.TEST_TARGET == 'x86_64-unknown-linux-gnu'
        run: pnpm --filter vite-task-tools exec playwright install-deps chromium

      - name: Run ignored tests
        run: |
          pnpm --filter vite-task-tools test
          $TEST_CARGO_CMD test --target $TEST_BUILD_TARGET -- --ignored

  # Running x64 binaries under Rosetta makes this the slowest job, so pull
  # requests run it only with the `ci: full` label.
  test-macos-x64:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.code-changed == 'true' &&
      (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci: full'))
    # No matrix: a skipped matrix job is listed under its unexpanded name.
    name: Test (macos-x64)
    runs-on: namespace-profile-mac-default
    env:
      TEST_TARGET: x86_64-apple-darwin
      TEST_CARGO_CMD: cargo
      TEST_BUILD_TARGET: x86_64-apple-darwin
      # Playwright detects the physical Apple Silicon CPU under Rosetta. Force
      # its x64 browser so fspy can inject its x64 preload.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: mac15
    steps: *test-steps

  # Building without a Rust cache inside the Alpine container makes this one of
  # the slowest jobs, so pull requests run it only with the `ci: full` label.
  test-musl:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.code-changed == 'true' &&
      (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci: full'))
    name: Test (musl)
    runs-on: namespace-profile-linux-x64-default
    container:
      image: node:25-alpine3.21
      options: --shm-size=256m # shm_io tests need bigger shared memory
    env:
      # Override all rustflags to skip the zig cross-linker from .cargo/config.toml.
      # Alpine's cc is already musl-native, so no custom linker is needed.
      # Must mirror [build].rustflags and target rustflags from .cargo/config.toml
      # (RUSTFLAGS env var overrides both levels).
      # -crt-static: vite-task is shipped as a NAPI module in vite+, and musl Node
      # with native modules links to musl libc dynamically, so we must do the same.
      RUSTFLAGS: -D warnings -C target-feature=-crt-static
      # On musl, concurrent PTY operations can trigger SIGSEGV in musl internals.
      # Run test threads sequentially to avoid the race.
      RUST_TEST_THREADS: 1
      # Playwright's bundled Chromium does not support musl. The browser fixture
      # is filtered out there, so avoid downloading an unusable glibc binary.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Install Alpine dependencies
        shell: sh {0}
        run: apk add --no-cache bash curl git musl-dev gcc g++ python3

      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        run: rustup show

      - name: Build tests
        run: cargo test --no-run

      # Default `cargo test` runs only tests that need nothing beyond the
      # Rust toolchain; this step verifies that contract before pnpm
      # populates `packages/tools/node_modules`.
      - name: Run tests
        run: cargo test

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1

      - name: Run ignored tests
        run: |
          pnpm --filter vite-task-tools test
          cargo test -- --ignored

  fmt:
    name: Format and Check Deps
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Update submodules
        run: git submodule update --init --recursive

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: fmt
          tools: cargo-shear@1.11.1,cargo-autoinherit@0.1.6
          components: clippy rust-docs rustfmt

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
      - run: pnpm exec vp fmt --check
      - run: cargo autoinherit && git diff --exit-code
      - run: cargo shear --deny-warnings
      - run: cargo fmt --check
      # --exclude fspy_benchmark: documenting it would build its musl artifact
      # dependency, which needs a rust-std this job otherwise has no use for.
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --exclude fspy_benchmark --no-deps --document-private-items

      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3
        with:
          files: .

      - name: Deduplicate dependencies
        run: pnpm dedupe --check

      - name: Check vite-task-client types are not stale
        run: |
          pnpm build-vite-task-client-types
          git diff --exit-code packages/vite-task-client/src/index.d.ts

      - name: Check test utility types
        run: pnpm --filter vite-task-tools check

  done:
    runs-on: namespace-profile-linux-x64-default
    if: always()
    needs:
      - clippy
      - test
      - test-macos-x64
      - test-musl
      - fmt
    steps:
      - run: exit 1
        # Thank you, next https://github.com/vercel/next.js/blob/canary/.github/workflows/build_and_test.yml#L379
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
