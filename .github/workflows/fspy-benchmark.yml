name: Fspy Benchmark

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

defaults:
  run:
    shell: bash

jobs:
  benchmark:
    name: Benchmark (${{ matrix.platform }})
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: namespace-profile-linux-x64-default
            static: true
          - platform: macos
            os: namespace-profile-mac-default
            static: false
          - platform: windows
            os: namespace-profile-windows-4c-8g
            static: false
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CRITERION_HOME: ${{ github.workspace }}/target/criterion
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Update Detours submodule
        if: matrix.platform == 'windows'
        run: git submodule update --init --recursive

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: fspy-benchmark-${{ matrix.platform }}

      - name: Install static target
        if: matrix.static
        run: rustup target add x86_64-unknown-linux-musl

      - name: Download main baseline
        id: main-baseline
        if: github.event_name != 'push'
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          github_token: ${{ github.token }}
          workflow: fspy-benchmark.yml
          workflow_conclusion: success
          branch: main
          event: push
          name: fspy-benchmark-baseline-v1-${{ matrix.platform }}
          path: ${{ env.CRITERION_HOME }}/fspy
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Download pull request baseline
        id: pr-baseline
        if: >-
          github.event_name == 'pull_request' &&
          steps.main-baseline.outputs.found_artifact != 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          github_token: ${{ github.token }}
          workflow: fspy-benchmark.yml
          workflow_conclusion: success
          branch: ${{ github.event.pull_request.head.ref }}
          event: pull_request
          name: fspy-benchmark-baseline-pr-v1-${{ github.event.pull_request.number }}-${{ matrix.platform }}
          path: ${{ env.CRITERION_HOME }}/fspy
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Run benchmark
        env:
          MAIN_BASELINE_FOUND: ${{ steps.main-baseline.outputs.found_artifact }}
          PR_BASELINE_FOUND: ${{ steps.pr-baseline.outputs.found_artifact }}
        run: |
          mkdir -p .benchmark-results
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            baseline=(--save-baseline main)
          elif [[ "$MAIN_BASELINE_FOUND" == "true" ]]; then
            baseline=(--baseline main)
          elif [[ "$PR_BASELINE_FOUND" == "true" ]]; then
            baseline=(--baseline pr)
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            baseline=(--save-baseline pr)
          else
            baseline=(--save-baseline main)
          fi
          set -o pipefail
          cargo bench --locked -p fspy_benchmark --bench fspy -- \
            --color never -n "${baseline[@]}" |
            tee ".benchmark-results/${{ matrix.platform }}.txt"

      - name: Add job summary
        run: |
          {
            echo '```text'
            cat ".benchmark-results/${{ matrix.platform }}.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save pull request baseline
        if: >-
          github.event_name == 'pull_request' &&
          steps.main-baseline.outputs.found_artifact != 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          for target in dynamic static; do
            source="$CRITERION_HOME/fspy/$target/new"
            if [[ -d "$source" ]]; then
              mkdir -p "$CRITERION_HOME/fspy/$target/pr"
              cp -R "$source/." "$CRITERION_HOME/fspy/$target/pr/"
            fi
          done

      - name: Upload main baseline
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fspy-benchmark-baseline-v1-${{ matrix.platform }}
          path: ${{ env.CRITERION_HOME }}/fspy
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Upload pull request baseline
        if: >-
          github.event_name == 'pull_request' &&
          steps.main-baseline.outputs.found_artifact != 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        # Until main has a baseline, keep Criterion's data so the next commit
        # in this pull request can compare against its latest run.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fspy-benchmark-baseline-pr-v1-${{ github.event.pull_request.number }}-${{ matrix.platform }}
          path: ${{ env.CRITERION_HOME }}/fspy
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Upload benchmark report
        if: github.event_name == 'pull_request'
        # Matrix jobs have isolated filesystems, so persist each report for the
        # comment job to combine into one sticky comment after all platforms finish.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fspy-benchmark-report-${{ matrix.platform }}
          path: .benchmark-results/${{ matrix.platform }}.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  comment:
    name: Report benchmark
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: benchmark
    runs-on: namespace-profile-linux-x64-default
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download benchmark reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fspy-benchmark-report-*
          path: .benchmark-results
          merge-multiple: true

      - name: Assemble comment
        run: |
          {
            echo '## fspy benchmark'
            echo
            for platform in linux macos windows; do
              echo "### $platform"
              echo
              echo '```text'
              cat ".benchmark-results/$platform.txt"
              echo '```'
              echo
            done
          } > .benchmark-results/comment.md

      - name: Update PR comment
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: fspy-benchmark
          path: .benchmark-results/comment.md
