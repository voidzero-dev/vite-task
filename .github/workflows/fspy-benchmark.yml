name: Fspy Benchmark

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

defaults:
  run:
    shell: bash

jobs:
  benchmark:
    name: Benchmark (${{ matrix.platform }})
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: namespace-profile-linux-x64-default
            static: true
          - platform: macos
            os: namespace-profile-mac-default
            static: false
          - platform: windows
            os: namespace-profile-windows-4c-8g
            static: false
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Update Detours submodule
        if: matrix.platform == 'windows'
        run: git submodule update --init --recursive

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: fspy-benchmark-${{ matrix.platform }}

      - name: Install static target
        if: matrix.static
        run: rustup target add x86_64-unknown-linux-musl

      - name: Set benchmark context
        id: context
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            context="pr-$PR_NUMBER"
            pull_request="$PR_NUMBER"
          else
            context="main"
            pull_request="none"
          fi
          echo "name=$context" >> "$GITHUB_OUTPUT"
          echo "pull-request=$pull_request" >> "$GITHUB_OUTPUT"

      - name: Find comparison baseline
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/fspy-benchmark.mjs resolve-baseline
          --platform "${{ matrix.platform }}"
          --context "${{ steps.context.outputs.name }}"

      - name: Download comparison baseline
        if: steps.baseline.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.baseline.outputs.artifact-name }}
          path: .benchmark-baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.baseline.outputs.run-id }}

      - name: Run benchmark
        run: cargo bench --locked -p fspy_benchmark --bench fspy

      - name: Collect benchmark results
        run: >-
          node .github/scripts/fspy-benchmark.mjs collect
          --criterion-root "$CARGO_TARGET_DIR/criterion/fspy"
          --output ".benchmark-results/${{ matrix.platform }}.json"
          --platform "${{ matrix.platform }}"
          --expect-static "${{ matrix.static }}"
          --runner "${{ matrix.os }}"
          --commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --event "$GITHUB_EVENT_NAME"
          --pull-request "${{ steps.context.outputs.pull-request }}"

      - name: Compare benchmark results
        run: >-
          node .github/scripts/fspy-benchmark.mjs compare
          --current ".benchmark-results/${{ matrix.platform }}.json"
          --baseline ".benchmark-baseline/${{ matrix.platform }}.json"
          --baseline-kind "${{ steps.baseline.outputs.kind }}"
          --output ".benchmark-results/${{ matrix.platform }}.md"

      - name: Add job summary
        run: cat ".benchmark-results/${{ matrix.platform }}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.baseline.outputs.current-artifact-name }}
          path: .benchmark-results/${{ matrix.platform }}.*
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 90

  comment:
    name: Report benchmark
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: benchmark
    runs-on: namespace-profile-linux-x64-default
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download current results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fspy-benchmark-*-pr-${{ github.event.pull_request.number }}
          path: .benchmark-results
          merge-multiple: true

      - name: Build PR comment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '<!-- fspy-benchmark-report -->'
            echo '## fspy benchmark'
            echo
            echo "Results for commit \`$GITHUB_SHA\`. Each platform uses its latest result from this PR, falling back to \`main\`."
            echo
            for platform in linux macos windows; do
              cat ".benchmark-results/$platform.md"
            done
            echo
            echo '<sub>This comment is updated by the Fspy Benchmark workflow.</sub>'
          } > benchmark-comment.md

      - name: Update PR comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";

          const marker = "<!-- fspy-benchmark-report -->";
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const pullRequest = process.env.PR_NUMBER;
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const commentsResponse = await fetch(
            `https://api.github.com/repos/${repository}/issues/${pullRequest}/comments?per_page=100`,
            { headers },
          );
          if (!commentsResponse.ok) throw new Error(await commentsResponse.text());
          const comments = await commentsResponse.json();
          const existing = comments.find(
            (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
          );
          const body = await readFile("benchmark-comment.md", "utf8");
          const url = existing
            ? `https://api.github.com/repos/${repository}/issues/comments/${existing.id}`
            : `https://api.github.com/repos/${repository}/issues/${pullRequest}/comments`;
          const response = await fetch(url, {
            method: existing ? "PATCH" : "POST",
            headers,
            body: JSON.stringify({ body }),
          });
          if (!response.ok) throw new Error(await response.text());
          EOF
