name: Fspy Benchmark Fork Report

permissions: {}

on: # zizmor: ignore[dangerous-triggers] PR artifacts are read as text and never executed.
  workflow_run:
    workflows: [Fspy Benchmark]
    types: [completed]

defaults:
  run:
    shell: bash

jobs:
  comment:
    name: Report fork benchmark
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: namespace-profile-linux-x64-default
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fspy-benchmark-*-pr-${{ github.event.workflow_run.pull_requests[0].number }}
          path: .benchmark-results
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build PR comment
        env:
          BENCHMARK_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo '<!-- fspy-benchmark-report -->'
            echo '## fspy benchmark'
            echo
            echo "Results for commit \`$BENCHMARK_SHA\`. Each platform uses its latest result from this PR, falling back to \`main\`."
            echo
            for platform in linux macos windows; do
              cat ".benchmark-results/$platform.md"
            done
            echo
            echo '<sub>This comment is updated by the Fspy Benchmark workflow.</sub>'
          } > benchmark-comment.md

      - name: Update PR comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";

          const marker = "<!-- fspy-benchmark-report -->";
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const pullRequest = process.env.PR_NUMBER;
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const commentsResponse = await fetch(
            `https://api.github.com/repos/${repository}/issues/${pullRequest}/comments?per_page=100`,
            { headers },
          );
          if (!commentsResponse.ok) throw new Error(await commentsResponse.text());
          const comments = await commentsResponse.json();
          const existing = comments.find(
            (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
          );
          const body = await readFile("benchmark-comment.md", "utf8");
          const url = existing
            ? `https://api.github.com/repos/${repository}/issues/comments/${existing.id}`
            : `https://api.github.com/repos/${repository}/issues/${pullRequest}/comments`;
          const response = await fetch(url, {
            method: existing ? "PATCH" : "POST",
            headers,
            body: JSON.stringify({ body }),
          });
          if (!response.ok) throw new Error(await response.text());
          EOF
