[package]
name = "vt"
version = "0.0.0"
edition.workspace = true
include = ["/src", "/build.rs"]
license.workspace = true
publish = false
readme = "README.md"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anstream = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
wincode = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive"] }
ctrlc = { workspace = true }
derive_more = { workspace = true, features = ["debug", "from"] }
futures-util = { workspace = true }
once_cell = { workspace = true }
owo-colors = { workspace = true }
petgraph = { workspace = true }
pty_terminal_test_client = { workspace = true }
rayon = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
rustc-hash = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
thiserror = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "io-std",
  "io-util",
  "macros",
  "process",
  "sync",
] }
tokio-util = { workspace = true }
tracing = { workspace = true }
twox-hash = { workspace = true }
materialized_artifact = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
vt_glob = { workspace = true }
vt_path = { workspace = true }
vt_select = { workspace = true }
vt_str = { workspace = true }
# Artifact dep under `[dependencies]` — not `[build-dependencies]`, where
# Cargo would compile it with the build-override profile (opt-level 0 in
# release; see https://github.com/rust-lang/cargo/issues/16719). Cargo
# provides `CARGO_CDYLIB_FILE_VT_CLIENT_NAPI` while compiling this crate
# for `artifact!` to embed.
vt_client_napi = { workspace = true }
vt_graph = { workspace = true }
vt_ipc_shared = { workspace = true }
vt_plan = { workspace = true }
vt_server = { workspace = true }
vt_workspace = { workspace = true }
wax = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
fspy = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
winapi = { workspace = true, features = ["handleapi", "jobapi2", "winnt"] }

[lib]
doctest = false
