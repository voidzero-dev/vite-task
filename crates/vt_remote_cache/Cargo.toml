[package]
name = "vt_remote_cache"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
ciborium = { workspace = true }
# `rustls-no-provider` selects rustls with rustls-platform-verifier, which
# verifies certificates using the operating system's trust store. The crypto
# provider is installed in `Client::new`. The vendored verifier does not
# depend on `webpki-roots` or `webpki-root-certs`; deny.toml bans both.
reqwest = { workspace = true, features = [
  "http2",
  "multipart",
  "rustls-no-provider",
  "stream",
  "system-proxy",
] }
rustls = { workspace = true, features = ["ring", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync"] }
url = { workspace = true }
vt_path = { workspace = true }
vt_str = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[lib]
doctest = false
