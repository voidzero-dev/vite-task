# Tests that running pkg#task errors when multiple packages share the same name,
# while --filter with the same name still matches all packages.

[[plan]]
compact = true
name = "ambiguous_package_name"
args = ["run", "@test/duplicate#build"]

[[plan]]
compact = true
name = "ambiguous_package_name_with_transitive"
args = ["run", "-t", "@test/duplicate#build"]

[[plan]]
compact = true
name = "filter_matches_both_duplicates"
args = ["run", "--filter", "@test/duplicate", "build"]

# The short name `duplicate` auto-completes to `@test/duplicate`, which two
# packages share. A `pkg#task` specifier errors instead of matching neither.
[[plan]]
compact = true
name = "ambiguous_short_package_name"
args = ["run", "duplicate#build"]
