platform = "windows"

[[plan]]
name = "case_insensitive_controls"
args = ["run", "build"]
env = { "vp_remote_cache" = "read-write", "vp_remote_cache_url" = "https://other.example/projects/test" }

[[plan]]
name = "prefix_overrides_cli"
args = ["run", "--remote-cache=read", "outer"]

[[plan]]
