[package]
name = "fspy_elf_loader"
version = "0.1.0"
links = "fspy_elf_loader"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "none"))'.dependencies]
allocator-api2 = { workspace = true }
elf = { workspace = true }
fspy_nostd = { workspace = true }
fspy_nostd_alloc = { workspace = true }
linux-raw-sys = { workspace = true, features = [
  "auxvec",
  "errno",
  "general",
  "no_std",
  "prctl",
  "ptrace",
] }
syscalls = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true
