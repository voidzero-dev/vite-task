# Tests that replayed logs maintain chronological order

[[e2e]]
name = "replay logs chronological order"
steps = [
  { argv = [
    "vt",
    "run",
    "build",
  ], comment = "cache miss" },
  { argv = [
    "vt",
    "run",
    "build",
  ], comment = "cache hit" },
  { argv = [
    "vt",
    "run",
    "build",
  ], comment = "cache hit" },
]
