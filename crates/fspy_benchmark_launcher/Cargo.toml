[package]
name = "fspy_benchmark_launcher"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "fspy_benchmark_launcher"
test = false
doctest = false

[dependencies]
fspy = { workspace = true }
# macros is fspy's, not ours: revisions of fspy that use select! without
# declaring the feature only compile when a dependent enables it, and this
# crate is built against the merge-base fspy on every benchmark run.
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread"] }
tokio-util = { workspace = true }
