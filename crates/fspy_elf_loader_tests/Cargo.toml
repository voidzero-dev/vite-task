[package]
name = "fspy_elf_loader_tests"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
ntest = { workspace = true }
elf = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[target.'cfg(target_arch = "aarch64")'.dev-dependencies]
fspy_elf_loader = { path = "../fspy_elf_loader", artifact = "bin:fspy_elf_loader_test_launcher", target = "aarch64-unknown-none-softfloat" }

[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
fspy_elf_loader = { path = "../fspy_elf_loader", artifact = "bin:fspy_elf_loader_test_launcher", target = "x86_64-unknown-none" }

[lints]
workspace = true

[package.metadata.cargo-shear]
ignored = ["fspy_elf_loader"]
