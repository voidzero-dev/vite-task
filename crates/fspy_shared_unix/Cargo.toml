[package]
name = "fspy_shared_unix"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(any(unix, target_os = "none"))'.dependencies]
allocator-api2 = { workspace = true, features = ["alloc"] }
base64 = { workspace = true }
bstr = { workspace = true }
fspy_nostd = { workspace = true }
fspy_nostd_alloc = { workspace = true }
fspy_shared = { workspace = true }
wincode = { workspace = true, features = ["derive"] }

[target.'cfg(any(target_os = "linux", target_os = "none"))'.dependencies]
bitflags = { workspace = true }
linux-raw-sys = { workspace = true, features = ["general", "no_std"] }

[target.'cfg(target_os = "macos")'.dependencies]
phf = { workspace = true, features = ["macros"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[lib]
doctest = false
