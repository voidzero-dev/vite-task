[package]
name = "fspy"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
allocator-api2 = { workspace = true, features = ["alloc"] }
derive_more = { workspace = true, features = ["debug"] }
fspy_shared = { workspace = true }
futures-util = { workspace = true }
libc = { workspace = true }
rustc-hash = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "process", "io-util", "sync", "rt"] }
tokio-util = { workspace = true }
vt_casefold = { workspace = true }
vt_materialized_artifact = { workspace = true }
which = { workspace = true, features = ["tracing"] }
wincode = { workspace = true }

[target.'cfg(unix)'.dependencies]
bumpalo = { workspace = true, features = ["allocator-api2", "collections"] }
fspy_shared_unix = { workspace = true }

# The preload artifact deps live under `[dependencies]` — not
# `[build-dependencies]`, where Cargo would compile them with the
# build-override profile (opt-level 0 in release; see
# https://github.com/rust-lang/cargo/issues/16719) — so they get the normal
# profile, in this workspace and downstream ones, with no per-package profile
# overrides. Cargo provides `CARGO_BIN_FILE_*` / `CARGO_CDYLIB_FILE_*` while
# compiling this crate for `artifact!` to embed.
[target.'cfg(target_os = "linux")'.dependencies]
fspy_elf_loader = { workspace = true }
linux-raw-sys = { workspace = true, features = ["general", "prctl", "ptrace"] }
syscalls = { workspace = true }
tracing = { workspace = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
fspy_preload_linux = { path = "../fspy_preload_linux", artifact = "bin", target = "x86_64-unknown-none" }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
fspy_preload_linux = { path = "../fspy_preload_linux", artifact = "bin", target = "aarch64-unknown-none-softfloat" }

[target.'cfg(target_os = "macos")'.dependencies]
fspy_preload_macos = { workspace = true }
ouroboros = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
fspy_detours_sys = { workspace = true }
fspy_preload_windows = { workspace = true }
ntapi = { workspace = true }
winapi = { workspace = true, features = ["winbase", "securitybaseapi", "handleapi"] }
winsafe = { workspace = true, features = ["kernel"] }

[dev-dependencies]
anyhow = { workspace = true }
csv-async = { workspace = true, features = ["tokio"] }
ctor = { workspace = true }
ntest = { workspace = true }
test-log = { workspace = true, features = ["trace"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-std"] }
vt_subprocess_test = { workspace = true, features = ["fspy"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
elf = { workspace = true }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dev-dependencies]
fspy_test_bin = { path = "../fspy_test_bin", artifact = "bin", target = "aarch64-unknown-linux-musl" }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
fspy_test_bin = { path = "../fspy_test_bin", artifact = "bin", target = "x86_64-unknown-linux-musl" }

[build-dependencies]
anyhow = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }

[lints]
workspace = true

[lib]
doctest = false

[package.metadata.cargo-shear]
ignored = [
  "ctor",
  "fspy_test_bin",
  "fspy_preload_linux",
  "fspy_preload_macos",
  "fspy_preload_windows",
]
