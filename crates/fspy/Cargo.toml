[package]
name = "fspy"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
allocator-api2 = { workspace = true, features = ["alloc"] }
wincode = { workspace = true }
bstr = { workspace = true, features = ["alloc", "std"] }
bumpalo = { workspace = true, features = ["allocator-api2", "collections"] }
derive_more = { workspace = true, features = ["debug"] }
materialized_artifact = { workspace = true }
fspy_shared = { workspace = true }
futures-util = { workspace = true }
libc = { workspace = true }
ouroboros = { workspace = true }
rustc-hash = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "process", "io-util", "sync", "rt"] }
tokio-util = { workspace = true }
which = { workspace = true, features = ["tracing"] }

[target.'cfg(target_os = "linux")'.dependencies]
fspy_seccomp_unotify = { workspace = true, features = ["supervisor"] }
nix = { workspace = true, features = ["uio"] }
tokio = { workspace = true, features = ["bytes"] }

# The supervision machinery (`fspy_shared_unix` exec/payload helpers and the
# `nix` syscalls) is only used by the Linux seccomp and macOS Detours backends
# in `src/unix/`. FreeBSD builds the no-op backend in `src/freebsd.rs` and does
# not compile `src/unix/`, so keep those deps off the FreeBSD build graph (and
# out of its transitive `fspy_nostd`/`fspy_client_unix` subtree).
[target.'cfg(all(unix, not(target_os = "freebsd")))'.dependencies]
fspy_shared_unix = { workspace = true }
nix = { workspace = true, features = ["fs", "process", "socket", "feature"] }

# The preload artifact deps live under `[dependencies]` — not
# `[build-dependencies]`, where Cargo would compile them with the
# build-override profile (opt-level 0 in release; see
# https://github.com/rust-lang/cargo/issues/16719) — so they get the normal
# profile, in this workspace and downstream ones, with no per-package profile
# overrides. Cargo provides `CARGO_CDYLIB_FILE_*` while compiling this crate
# for `artifact!` to embed. Each dep is scoped to the targets whose code
# embeds it, so other targets (e.g. musl, which never dynamically links a
# preload) don't build a useless empty cdylib. Scoping artifact deps under
# `[target.cfg…]` is only safe for normal deps: the same shape under
# `[target.cfg….build-dependencies]` panics cargo's resolver on cross-compile.
[target.'cfg(all(unix, not(target_env = "musl"), not(target_os = "freebsd")))'.dependencies]
fspy_preload_unix = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
fspy_detours_sys = { workspace = true }
fspy_preload_windows = { workspace = true }
winapi = { workspace = true, features = ["winbase", "securitybaseapi", "handleapi"] }
winsafe = { workspace = true, features = ["kernel"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
csv-async = { workspace = true, features = ["tokio"] }
ctor = { workspace = true }
ntest = { workspace = true }
subprocess_test = { workspace = true, features = ["fspy"] }
test-log = { workspace = true, features = ["trace"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-std"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dev-dependencies]
fspy_test_bin = { path = "../fspy_test_bin", artifact = "bin", target = "aarch64-unknown-linux-musl" }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
fspy_test_bin = { path = "../fspy_test_bin", artifact = "bin", target = "x86_64-unknown-linux-musl" }

[build-dependencies]
anyhow = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }

[lints]
workspace = true

[lib]
doctest = false

[package.metadata.cargo-shear]
ignored = ["ctor", "fspy_test_bin", "fspy_preload_unix", "fspy_preload_windows"]
