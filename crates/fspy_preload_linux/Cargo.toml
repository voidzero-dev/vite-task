[package]
name = "fspy_preload_linux"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
allocator-api2 = { workspace = true, features = ["alloc"] }
bstr = { workspace = true }
fspy_elf_loader = { workspace = true }
fspy_nostd = { workspace = true }
fspy_nostd_alloc = { workspace = true }
fspy_shared = { workspace = true }
fspy_shared_unix = { workspace = true }
linux-raw-sys = { workspace = true, features = ["general", "no_std"] }
syscalls = { workspace = true }

[[bin]]
name = "fspy_preload_linux"
path = "src/main.rs"
test = false
bench = false

[lints]
workspace = true
