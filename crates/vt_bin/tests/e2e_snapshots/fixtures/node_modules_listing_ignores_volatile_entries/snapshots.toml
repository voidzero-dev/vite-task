[[e2e]]
name = "node_modules_listing_ignores_volatile_entries"
comment = """
A task walks `node_modules`. pnpm's `.pnpm-workspace-state-*.json` and Vite's `.vite-temp` appearing or disappearing there don't invalidate the cache, while a real package entry added to `node_modules` still causes a cache miss.
"""
steps = [
  { argv = [
    "vtt",
    "mkdir",
    "-p",
    "node_modules/real-pkg",
  ], comment = "seed a real package under node_modules" },
  { argv = [
    "vtt",
    "write-file",
    "node_modules/.pnpm-workspace-state-v1.json",
    "{}",
  ], comment = "pnpm workspace state file exists before the first run" },
  { argv = [
    "vt",
    "run",
    "list",
  ], comment = "first run: cache miss" },
  { argv = [
    "vtt",
    "rm",
    "node_modules/.pnpm-workspace-state-v1.json",
  ], comment = "pnpm workspace state file is removed" },
  { argv = [
    "vtt",
    "write-file",
    "node_modules/.vite-temp/vite.config.ts.timestamp-1.mjs",
    "export default {}",
  ], comment = "Vite creates its transient config temp folder and file" },
  { argv = [
    "vt",
    "run",
    "list",
  ], comment = "cache hit despite volatile entries appearing and disappearing" },
  { argv = [
    "vtt",
    "write-file",
    "node_modules/.pnpm-workspace-state-v2.json",
    "{}",
  ], comment = "pnpm writes a workspace state file" },
  { argv = [
    "vtt",
    "rm",
    "-rf",
    "node_modules/.vite-temp",
  ], comment = "Vite temp folder is removed" },
  { argv = [
    "vt",
    "run",
    "list",
  ], comment = "cache hit again" },
  { argv = [
    "vtt",
    "mkdir",
    "-p",
    "node_modules/another-pkg",
  ], comment = "a real package appears in node_modules" },
  { argv = [
    "vt",
    "run",
    "list",
  ], comment = "cache miss for the real package" },
]
