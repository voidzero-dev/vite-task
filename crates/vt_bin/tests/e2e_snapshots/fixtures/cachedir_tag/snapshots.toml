[[e2e]]
name = "read_write_inside_tagged_dir_is_cached"
comment = """
A directory holding a valid `CACHEDIR.TAG` is a cache directory. A task that reads and rewrites a file anywhere inside it is cached, and changing that file afterwards doesn't cause a cache miss.
"""
steps = [
  ["vt", "run", "tagged"],
  { argv = ["vt", "run", "tagged"], comment = "cache hit" },
  ["vtt", "replace-file-content", "tagged/sub/state.txt", "i", "x"],
  { argv = ["vt", "run", "tagged"], comment = "still a cache hit: the file is inside the tagged directory" },
]

[[e2e]]
name = "read_write_without_tag_is_not_cached"
comment = """
Without a `CACHEDIR.TAG`, the same task modifies its inputs and isn't cached.
"""
steps = [["vt", "run", "untagged"], ["vt", "run", "untagged"]]

[[e2e]]
name = "invalid_tag_is_not_a_cache_dir"
comment = """
A `CACHEDIR.TAG` with the wrong signature, or a directory named `CACHEDIR.TAG`, doesn't mark a cache directory.
"""
steps = [["vt", "run", "invalid-signature"], ["vt", "run", "tag-is-dir"]]

[[e2e]]
name = "writes_inside_tagged_dir_are_still_restored"
comment = """
The tag only affects inputs. A file the task writes inside a tagged directory is still an output, so a cache hit restores it.
"""
steps = [
  ["vt", "run", "tagged-write"],
  { argv = ["vtt", "rm", "-rf", "tagged/out"], comment = "delete the output" },
  { argv = ["vt", "run", "tagged-write"], comment = "cache hit, restores the output" },
  { argv = ["vtt", "print-file", "tagged/out/built.txt"], comment = "restored" },
]
