[[e2e]]
name = "node_modules_bin_content_ignored"
comment = """
Only whether a file in `node_modules/.bin` exists is part of the fingerprint, so a shim rewritten with the workspace at another path keeps the cache hit. Removing it is a cache miss.
"""
steps = [
  [
    "vtt",
    "mkdir",
    "-p",
    "node_modules/.bin",
  ],
  [
    "vtt",
    "cp",
    "shim.sh",
    "node_modules/.bin/tool",
  ],
  { argv = [
    "vt",
    "run",
    "read-shim",
  ], comment = "cache miss" },
  { argv = [
    "vtt",
    "replace-file-content",
    "node_modules/.bin/tool",
    "/home/alice/project",
    "/home/bob/project",
  ], comment = "reinstall with the workspace at another path" },
  { argv = [
    "vt",
    "run",
    "read-shim",
  ], comment = "cache hit" },
  { argv = [
    "vtt",
    "rm",
    "node_modules/.bin/tool",
  ], comment = "remove the shim" },
  { argv = [
    "vt",
    "run",
    "read-shim",
  ], comment = "cache miss: input removed" },
]
