[[e2e]]
name = "vitest_fs_module_cache"
comment = """
Vitest 5 with `fsModuleCache` writes each transformed module to `node_modules/.vitest-cache/.tmp-*`, renames it to `node_modules/.vitest-cache/<hash>` and reads it back. It also writes `_metadata.json` there and rewrites `node_modules/.vite/vitest/<hash>/results.json`.
"""
ignore = true
steps = [
  [
    "vt",
    "run",
    "test",
  ],
  { argv = [
    "vtt",
    "rm",
    "-r",
    "node_modules/.vitest-cache",
    "node_modules/.vite/vitest",
  ], comment = "remove Vitest's caches, as on a clean checkout (vp's own cache is in `node_modules/.vite/task-cache`)" },
  [
    "vt",
    "run",
    "test",
  ],
  { argv = [
    "vtt",
    "rm",
    "node_modules/.vitest-cache/_metadata.json",
  ], comment = "remove the metadata, whose place among the hashed names in the listing varies" },
  [
    "vtt",
    "list-dir",
    "node_modules/.vitest-cache",
  ],
]
