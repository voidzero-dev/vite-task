[[e2e]]
name = "ctrl_c_during_upload"
cfg = "not(windows)"
ignore = true
steps = [
  { argv = [
    "remote-cache-server",
    "--stall",
    "/store",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
  ], interactions = [
    { "expect-milestone" = "uploads-pending" },
    { "write-key" = "ctrl-c" },
  ], comment = "The fetch is a miss, but the backend never responds to the upload. Ctrl-C cancels it while vt run waits." },
  { argv = [
    "vt",
    "run",
    "--last-details",
  ], comment = "The details show why build wasn't uploaded." },
  { argv = [
    "vt",
    "run",
    "build",
  ], comment = "The entry is still in the local cache." },
]

