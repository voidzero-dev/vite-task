# Cases that use the remote cache backend are ignored because it runs on
# Node.js. Windows is skipped because the PTY launcher cannot execute pnpm
# command shims. Whether an upload to the backend is still running when the
# tasks finish depends on timing, so steps that upload hide the message about
# pending uploads. The cases that test it stall the uploads instead.
[[e2e]]
name = "read_write"
cfg = "not(windows)"
ignore = true
steps = [
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
    [
      "VP_RUN_INTERNAL_HIDE_PENDING_UPLOADS",
      "1",
    ],
  ], comment = "The fetch finds no entry. The new execution is uploaded with one store request, and vt run waits for it after the task finishes." },
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
  ], comment = "A local hit makes no requests." },
]

