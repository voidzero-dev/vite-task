  ], comment = "The details include the underlying error." },
  { argv = [
    "vtt",
    "list-dir",
    "node_modules/.vite/task-cache",
    "--ext",
    ".tmp",
    "--recursive",
  ], comment = "The corrupt download was removed." },
]

[[e2e]]
name = "restore_failure"
cfg = "not(windows)"
ignore = true
steps = [
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
    [
      "VP_RUN_INTERNAL_HIDE_PENDING_UPLOADS",
      "1",
    ],
  ] },
  [
    "vt",
    "cache",
    "clean",
  ],
  [
    "vtt",
    "rm",
    "-rf",
    "dist",
  ],
  { argv = [
    "vtt",
    "write-file",
    "dist",
    "file",
  ], comment = "A file where the output directory goes makes restoring fail." },
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], comment = "The remote hit can't be restored, so the task fails." },
  { argv = [
    "vt",
    "run",
    "--last-details",
  ], comment = "The details include the underlying error." },
  { argv = [
    "vtt",
    "list-dir",
    "node_modules/.vite/task-cache",
    "--ext",
    ".tar.zst",
    "--recursive",
  ], comment = "The downloaded archive was removed, and the entry wasn't cached locally." },
  [
    "vtt",
    "rm",
    "dist",
  ],
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], comment = "Nothing was cached locally, so the remote entry is fetched and restored again." },
]

[[e2e]]
name = "pending_uploads"
cfg = "not(windows)"
ignore = true
steps = [
  { argv = [
    "remote-cache-server",
    "--stall",
    "/store",
    "vt",
    "run",
    "all",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
  ], interactions = [
    { "expect-milestone" = "uploads-pending" },
    { "write-key" = "ctrl-c" },
  ], comment = "The backend never responds to the uploads. check doesn't wait for build's upload, so both are still running when check finishes, and vt run waits for them until Ctrl-C." },
  { argv = [
    "vt",
    "run",
    "--last-details",
  ], comment = "Both uploads were cancelled." },
]

