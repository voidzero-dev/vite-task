# Cases that use the remote cache backend are ignored because it runs on
# Node.js. Windows is skipped because the PTY launcher cannot execute pnpm
# command shims.
[[e2e]]
name = "read_write"
cfg = "not(windows)"
ignore = true
steps = [
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
  ], comment = "The fetch finds no entry. The new execution is uploaded with one store request." },
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
  ], comment = "A local hit makes no requests." },
]

[[e2e]]
name = "read"
cfg = "not(windows)"
ignore = true
steps = [
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
  ] },
  [
    "vtt",
    "write-file",
    "src/a.txt",
    "changed",
  ],
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], comment = "An endpoint without a mode selects read. The task reruns without uploading." },
]

[[e2e]]
name = "restore"
cfg = "not(windows)"
ignore = true
steps = [
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
  ] },
  [
    "vt",
    "cache",
    "clean",
  ],
  [
    "vtt",
    "rm",
    "-rf",
    "dist",
  ],
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
  ], comment = "A remote hit downloads the output archive. Hits never upload." },
  { argv = [
    "vtt",
    "print-file",
    "dist/output.txt",
  ], comment = "The outputs are restored." },
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], comment = "The remote hit was recorded locally, so this is a local hit with no requests." },
  [
    "vt",
    "cache",
    "clean",
  ],
  [
    "vtt",
    "write-file",
    "src/a.txt",
    "changed",
  ],
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], comment = "The exact entry fails validation, so the archive isn't downloaded." },
]

[[e2e]]
name = "local_and_remote_hits"
cfg = "not(windows)"
ignore = true
steps = [
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
  ] },
  [
    "vt",
    "cache",
    "clean",
  ],
  { argv = [
    "vt",
    "run",
    "check",
  ], comment = "Without an endpoint, check is cached only locally." },
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "all",
  ], comment = "build is a remote hit, and check is a local hit. The summary counts the remote hit." },
  { argv = [
    "vt",
    "run",
    "--last-details",
  ], comment = "The details show which hit came from the remote cache." },
]

[[e2e]]
name = "fallback"
cfg = "not(windows)"
ignore = true
steps = [
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
