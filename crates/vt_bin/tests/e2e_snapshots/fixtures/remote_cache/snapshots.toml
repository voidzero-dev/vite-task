[[e2e]]
name = "ctrl_c_during_fetch"
steps = [
  { argv = [
    "vtt",
    "stalled-remote-cache",
    "vt",
    "run",
    "build",
  ], interactions = [
    { "expect-milestone" = "request" },
    { "write-key" = "ctrl-c" },
  ], comment = "The endpoint never responds. Ctrl-C stops the fetch, and the task doesn't start." },
]

[[e2e]]
name = "fast_fail_during_fetch"
steps = [
  { argv = [
    "vtt",
    "stalled-remote-cache",
    "vt",
    "run",
    "fail-during-build",
  ], comment = "The endpoint never responds. fail exits while build's fetch is in flight, which stops the fetch, and build doesn't start." },
]

[[e2e]]
name = "github_oidc_upload"
steps = [
  { argv = [
    "vtt",
    "oidc-remote-cache",
    "vt",
    "run",
    "verify",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
  ], comment = "The first upload requests an OIDC token for the endpoint, and the second reuses it. Fetches send no token." },
]

[[e2e]]
name = "github_oidc_missing_permission"
steps = [
  { argv = [
    "vtt",
    "oidc-remote-cache",
    "--without-oidc",
    "vt",
    "run",
    "verify",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
    [
      "GITHUB_ACTIONS",
      "true",
    ],
  ], comment = "Without the OIDC variables, the first upload has no token and is rejected. The second upload is skipped without a request, with the same reason. The tasks succeed." },
  { argv = [
    "vt",
    "run",
    "--last-details",
  ], comment = "The details suggest granting `id-token: write`." },
]
