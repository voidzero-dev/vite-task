[[e2e]]
name = "restore"
cfg = "not(windows)"
ignore = true
steps = [
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
    [
      "VP_RUN_INTERNAL_HIDE_PENDING_UPLOADS",
      "1",
    ],
  ] },
  [
    "vt",
    "cache",
    "clean",
  ],
  [
    "vtt",
    "rm",
    "-rf",
    "dist",
  ],
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
  ], comment = "A remote hit downloads the output archive. Hits never upload." },
  { argv = [
    "vtt",
    "print-file",
    "dist/output.txt",
  ], comment = "The outputs are restored." },
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], comment = "The remote hit was recorded locally, so this is a local hit with no requests." },
  [
    "vt",
    "cache",
    "clean",
  ],
  [
    "vtt",
    "write-file",
    "src/a.txt",
    "changed",
  ],
  { argv = [
    "remote-cache-server",
    "vt",
    "run",
    "build",
  ], comment = "The exact entry fails validation, so the archive isn't downloaded." },
]

