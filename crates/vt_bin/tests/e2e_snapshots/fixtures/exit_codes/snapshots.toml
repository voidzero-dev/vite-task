[[e2e]]
name = "nested_continue_failure_fast_fails_outer_run"
comment = """
When a nested `vt run --continue` finishes with a failure, its task fails, and an outer run without `--continue` fast-fails as usual. `fails-after-barrier` (in the nested run) and `hangs-beside-nested` (in the outer run) share a 2-way barrier, so the hanging task is running when the nested run fails. Completing without a timeout shows the outer run killed it.
"""
cwd = "packages/pkg-c"
steps = [
  { argv = [
    "vt",
    "run",
    "nested-failure-stops-outer",
  ], comment = "the nested run fails, so the outer run kills hangs-beside-nested" },
]

[[e2e]]
name = "fast_fail_kills_tasks_in_nested_continue_run"
comment = """
A nested `vt run --continue` doesn't protect its tasks from an outer run that fast-fails. `fails-beside-nested` (in the outer run) and `hangs-after-barrier` (in the nested run) share a 2-way barrier, so the hanging task is running when the outer task fails. Completing without a timeout shows the outer failure killed it.
"""
cwd = "packages/pkg-c"
steps = [
  { argv = [
    "vt",
    "run",
    "failure-stops-nested-continue",
  ], comment = "fails-beside-nested fails, so hangs-after-barrier in the nested run is killed" },
]

[[e2e]]
name = "continue_applies_to_task_picked_in_selector"
comment = """
When the task name doesn't match and the task selector opens, `--continue` applies to the task picked there. `VP_RUN_CONCURRENCY_LIMIT=1` runs fail-3 and fail-5 one after the other, so the second only runs if the first failure doesn't cancel the run.
"""
cwd = "packages/pkg-c"
steps = [
  { argv = [
    "vt",
    "run",
    "--continue",
    "two-failure",
  ], envs = [
    [
      "VP_RUN_CONCURRENCY_LIMIT",
      "1",
    ],
  ], interactions = [
    { "expect-milestone" = "task-select:two-failure:0" },
    { "write-key" = "enter" },
  ], comment = "pick two-failures: fail-3 and fail-5 both run" },
]

[[e2e]]
name = "continue_survives_output_forwarding_failure"
comment = """
With `--continue`, a task that fails because its output can't be forwarded doesn't cancel the run. `vtt broken-stdout` gives `vt` a stdout whose writes all fail, so `noisy` fails when it prints. The scheduling is the same as in `continue_keeps_running_independent_tasks`: `noisy` waits at the barrier for one `independent-*` task, then prints and fails, and only the slot it frees can start the other `independent-*` task. The first step's output can't be seen. The second step, with a working stdout, replays `independent-1` from the cache (the two `independent-*` tasks run the same command, so they share a cache entry). Had the failure cancelled the run, the `independent-*` task waiting at the barrier would have been killed and the other never started, leaving nothing to replay.
"""
cwd = "packages/pkg-c"
steps = [
  { argv = [
    "vtt",
    "broken-stdout",
    "--",
    "vt",
    "run",
    "--continue",
    "--concurrency-limit",
    "2",
    "forward-failure",
  ], comment = "noisy fails to forward its output, the independent tasks pass" },
  { argv = [
    "vt",
    "run",
    "independent-1",
  ], comment = "setup and independent-1 replay from the cache" },
]
