[[e2e]]
name = "continue_exits_1_when_several_tasks_fail"
comment = """
With `--continue`, independent failing tasks all run. With more than one failure, the run exits 1 instead of a task's exit code.
"""
cwd = "packages/pkg-c"
steps = [
  { argv = [
    "vt",
    "run",
    "--continue",
    "two-failures",
  ], comment = "fail-3 and fail-5 both run" },
]

[[e2e]]
name = "no_bail_is_an_alias_for_continue"
comment = """
`--no-bail`, pnpm's name for the same behavior, works like `--continue`. With a concurrency limit of 1, fail-3 and fail-5 run one after the other, so the second only runs if the first failure doesn't cancel the run.
"""
cwd = "packages/pkg-c"
steps = [
  { argv = [
    "vt",
    "run",
    "--no-bail",
    "--concurrency-limit",
    "1",
    "two-failures",
  ], comment = "fail-3 and fail-5 both run" },
]

[[e2e]]
name = "continue_skips_dependents_of_nested_run_failure"
comment = """
With `--continue`, a failure inside a nested `vt run` counts as its task failing, so that task's dependents don't run.
"""
cwd = "packages/pkg-c"
steps = [
  { argv = [
    "vt",
    "run",
    "--continue",
    "after-nested",
  ], comment = "nested runs fail-3, which exits 3, so after-nested doesn't run" },
]

[[e2e]]
name = "continue_in_nested_run_applies_to_that_run"
comment = """
A `vt run --continue` in a task's script applies to the tasks it runs, even when the outer `vt run` has no `--continue`. With a concurrency limit of 1, fail-3 and fail-5 run one after the other, so the second only runs if the first failure doesn't cancel the run.
"""
cwd = "packages/pkg-c"
steps = [
  { argv = [
    "vt",
    "run",
    "nested-continue",
  ], comment = "the nested run has --continue: fail-3 and fail-5 both run" },
]

