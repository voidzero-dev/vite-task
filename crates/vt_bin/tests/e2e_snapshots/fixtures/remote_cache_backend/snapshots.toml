# Windows is skipped because the PTY launcher cannot execute pnpm command shims.
[[e2e]]
name = "entries_and_associations"
cfg = "not(windows)"
ignore = true
steps = [
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": 'A', \"secondary_key\": 'S'}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-cbor",
    "metadata={\"key\": 'A', \"secondary_key\": 'S', \"value\": 'VA'}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-cbor",
    "metadata={\"key\": 'A', \"secondary_key\": 'U', \"value\": 'VA'}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-cbor",
    "metadata={\"key\": 'B', \"secondary_key\": 'S', \"value\": 'VB'}",
  ],
  { argv = [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": 'A', \"secondary_key\": 'S'}",
  ], comment = "The exact entry survives reassignment of S to B." },
  { argv = [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": 'C', \"secondary_key\": 'S'}",
  ], comment = "The previous fetch did not change S, so fallback returns B's entry." },
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-cbor",
    "metadata={\"key\": 'A', \"secondary_key\": 'T', \"value\": 'VA2'}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": 'A', \"secondary_key\": 'missing'}",
  ],
  { argv = [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": 'C', \"secondary_key\": 'U'}",
  ], comment = "An older association to A still resolves after A is replaced." },
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": 'C', \"secondary_key\": 'T'}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": 'C', \"secondary_key\": 'S'}",
  ],
]

[[e2e]]
name = "blob_replacement"
cfg = "not(windows)"
ignore = true
steps = [
  [
    "remote-cache-server",
    "cbor-http",
    "GET",
    "/blob/missing",
  ],
  [
    "vtt",
    "write-file",
    "archive.txt",
    "first archive",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-cbor",
    "metadata={\"key\": 'A', \"secondary_key\": 'S', \"value\": 'first'}",
    "--form-file",
    "blob=archive.txt",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": 'A', \"secondary_key\": 'S'}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "GET",
    "/blob/1",
  ],
  { argv = [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-data",
    "blob='second archive'",
    "--form-cbor",
    "metadata={\"key\": 'A', \"secondary_key\": 'S', \"value\": 'second'}",
  ], comment = "Accept blob before metadata, with neither part supplying a filename." },
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": 'A', \"secondary_key\": 'S'}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "GET",
    "/blob/2",
  ],
  { argv = [
    "remote-cache-server",
    "cbor-http",
    "GET",
    "/blob/1",
  ], comment = "Previously returned IDs retain their original bytes." },
  { argv = [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-cbor",
    "metadata={\"key\": 'A', \"secondary_key\": 'S', \"value\": 'no archive'}",
  ], comment = "Omitting blob clears the association." },
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": 'A', \"secondary_key\": 'S'}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-cbor",
    "metadata={\"key\": 'A', \"secondary_key\": 'S', \"value\": 'empty archive'}",
    "--form-data",
    "blob=''",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": 'A', \"secondary_key\": 'S'}",
  ],
  { argv = [
    "remote-cache-server",
    "cbor-http",
    "GET",
    "/blob/3",
  ], comment = "An empty blob has an ID and downloads as an empty byte string." },
]

[[e2e]]
name = "opaque_binary_data"
cfg = "not(windows)"
ignore = true
steps = [
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-cbor",
    "metadata={\"key\": b64'AP+A', \"secondary_key\": '', \"value\": b64'AP+A'}",
    "--form-data",
    "blob=b64'AP+A'",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": b64'AP+A', \"secondary_key\": ''}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": '', \"secondary_key\": ''}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "GET",
    "/blob/1",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-cbor",
    "metadata={\"key\": '', \"secondary_key\": '', \"value\": ''}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": '', \"secondary_key\": ''}",
  ],
]

[[e2e]]
name = "invalid_requests"
cfg = "not(windows)"
ignore = true
steps = [
  [
    "remote-cache-server",
    "cbor-http",
    "GET",
    "/missing",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--data",
    "'bad'",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--data",
    "'bad'",
    "--content-type",
    "application/cbor",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": \"text\", \"secondary_key\": ''}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": ''}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "[]",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": '', \"key\": 'duplicate', \"secondary_key\": ''}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-cbor",
    "metadata={\"key\": 'A', \"secondary_key\": 'S', \"value\": 'original'}",
    "--form-data",
    "blob='original archive'",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--cbor",
    "{}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-data",
    "blob='missing metadata'",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-cbor",
    "metadata={\"key\": 'A', \"secondary_key\": 'T', \"value\": \"wrong type\"}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-cbor",
    "metadata={\"key\": 'A', \"secondary_key\": 'T', \"value\": 'replacement'}",
    "--form-cbor",
    "metadata={}",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-cbor",
    "metadata={\"key\": 'A', \"secondary_key\": 'T', \"value\": 'replacement'}",
    "--form-data",
    "blob='one'",
    "--form-data",
    "blob='two'",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-cbor",
    "metadata={}",
    "--form-data",
    "unexpected='part'",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-data",
    "metadata='wrong content type'",
  ],
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--data",
    "'--boundary\\r\\nContent-Disposition: form-data; name=\"metadata\"\\r\\nContent-Type: application/cbor\\r\\n\\r\\n'",
    "--content-type",
    "multipart/form-data; boundary=boundary",
  ],
  { argv = [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": 'A', \"secondary_key\": 'S'}",
  ], comment = "Failed stores did not replace the value or blob." },
  [
    "remote-cache-server",
    "cbor-http",
    "GET",
    "/blob/1",
  ],
  { argv = [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": 'B', \"secondary_key\": 'T'}",
  ], comment = "Failed stores did not publish a secondary association." },
]

[[e2e]]
name = "state_across_invocations"
cfg = "not(windows)"
ignore = true
steps = [
  [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-cbor",
    "metadata={\"key\": 'A', \"secondary_key\": 'S', \"value\": 'VA'}",
    "--form-data",
    "blob='first archive'",
  ],
  { argv = [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/fetch",
    "--cbor",
    "{\"key\": 'C', \"secondary_key\": 'S'}",
  ], comment = "A later invocation reads the stored entry and association." },
  { argv = [
    "remote-cache-server",
    "cbor-http",
    "POST",
    "/store",
    "--form-cbor",
    "metadata={\"key\": 'B', \"secondary_key\": 'T', \"value\": 'VB'}",
    "--form-data",
    "blob='second archive'",
  ], comment = "Blob numbering continues across invocations." },
  { argv = [
    "vtt",
    "write-file",
    "remote-cache/blobs/1",
    "replaced archive",
  ], comment = "Each blob is a file named by its ID." },
  [
    "remote-cache-server",
    "cbor-http",
    "GET",
    "/blob/1",
  ],
]
