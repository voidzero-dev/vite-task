# These cases use the remote cache backend, so they are ignored because it
# runs on Node.js, and skipped on musl because workerd's prebuilt binaries
# require glibc. Each starts its own backend first and stops it last. Steps
# that upload run with `--github-actions`, as a job of a push to the main
# branch, and hide the message about pending uploads, whose timing varies.
# Request lines list an exact fetch's entries by blob number, newest first.
[[e2e]]
name = "older_entries"
comment = "A key keeps its newest entries. A lookup checks them newest first and restores the first one that matches."
cfg = 'not(target_env = "musl")'
ignore = true
steps = [
  [
    "remote-cache-server",
    "start",
  ],
  { argv = [
    "remote-cache-server",
    "run",
    "--github-actions",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
    [
      "VP_RUN_INTERNAL_HIDE_PENDING_UPLOADS",
      "1",
    ],
  ], comment = "The first entry, for `src/a.txt` with 1, has blob 1." },
  [
    "vtt",
    "write-file",
    "src/a.txt",
    "2",
  ],
  { argv = [
    "remote-cache-server",
    "run",
    "--github-actions",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
    [
      "VP_RUN_INTERNAL_HIDE_PENDING_UPLOADS",
      "1",
    ],
  ], comment = "The fetch returns the key's only entry, which doesn't match. The entry for 2 is added." },
  [
    "vtt",
    "write-file",
    "src/a.txt",
    "3",
  ],
  { argv = [
    "remote-cache-server",
    "run",
    "--github-actions",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
    [
      "VP_RUN_INTERNAL_HIDE_PENDING_UPLOADS",
      "1",
    ],
  ], comment = "The entries come newest first." },
  [
    "vtt",
    "write-file",
    "src/a.txt",
    "1",
  ],
  { argv = [
    "remote-cache-server",
    "run",
    "vt",
    "run",
    "build",
  ], comment = "The local entry is for 3. Of the remote entries, only the oldest matches, so its blob is downloaded." },
  { argv = [
    "vtt",
    "print-file",
    "output.txt",
  ], comment = "The outputs of the run for 1 are restored." },
  [
    "remote-cache-server",
    "stop",
  ],
]

[[e2e]]
name = "newest_entry_explains_miss"
cfg = 'not(target_env = "musl")'
ignore = true
steps = [
  [
    "remote-cache-server",
    "start",
  ],
  { argv = [
    "remote-cache-server",
    "run",
    "--github-actions",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
    [
      "VP_RUN_INTERNAL_HIDE_PENDING_UPLOADS",
      "1",
    ],
  ] },
  [
    "vtt",
    "write-file",
    "src/b.txt",
    "x",
  ],
  { argv = [
    "remote-cache-server",
    "run",
    "--github-actions",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
    [
      "VP_RUN_INTERNAL_HIDE_PENDING_UPLOADS",
      "1",
    ],
  ], comment = "The entry for `src/b.txt` with x is added." },
  [
    "vtt",
    "write-file",
    "src/b.txt",
    "y",
  ],
  [
    "vt",
    "cache",
    "clean",
  ],
  { argv = [
    "remote-cache-server",
    "run",
    "vt",
    "run",
    "build",
  ], comment = "No entry matches. The miss is explained against the newest entry, in which `src/b.txt` had other contents. The older entry had no `src/b.txt`." },
  [
    "remote-cache-server",
    "stop",
  ],
]

