[[e2e]]
name = "entries_per_key_isolation"
comment = "The namespace keeps one entry per key. Tasks with other values of `MODE` have other keys."
cfg = 'not(target_env = "musl")'
ignore = true
steps = [
  [
    "remote-cache-server",
    "start",
    "--entries-per-key",
    "1",
  ],
  { argv = [
    "remote-cache-server",
    "run",
    "--github-actions",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
    [
      "VP_RUN_INTERNAL_HIDE_PENDING_UPLOADS",
      "1",
    ],
    [
      "MODE",
      "a",
    ],
  ], comment = "The entry for `MODE` a and `src/a.txt` with 1 has blob 1." },
  { argv = [
    "remote-cache-server",
    "run",
    "--github-actions",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
    [
      "VP_RUN_INTERNAL_HIDE_PENDING_UPLOADS",
      "1",
    ],
    [
      "MODE",
      "b",
    ],
  ], comment = "Key b has no entry yet, so the fetch falls back to key a." },
  [
    "vtt",
    "write-file",
    "src/a.txt",
    "2",
  ],
  { argv = [
    "remote-cache-server",
    "run",
    "--github-actions",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
    [
      "VP_RUN_INTERNAL_HIDE_PENDING_UPLOADS",
      "1",
    ],
    [
      "MODE",
      "b",
    ],
  ], comment = "The entry for 2 replaces key b's entry for 1." },
  [
    "vtt",
    "write-file",
    "src/a.txt",
    "1",
  ],
  [
    "vt",
    "cache",
    "clean",
  ],
  { argv = [
    "remote-cache-server",
    "run",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "MODE",
      "b",
    ],
  ], comment = "Key b only has its entry for 2, so the run misses." },
  { argv = [
    "remote-cache-server",
    "run",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "MODE",
      "a",
    ],
  ], comment = "Key a still has its entry for 1: entries of other keys don't take its place." },
  [
    "remote-cache-server",
    "stop",
  ],
]

[[e2e]]
name = "expired_entries"
cfg = 'not(target_env = "musl")'
ignore = true
steps = [
  [
    "remote-cache-server",
    "start",
  ],
  { argv = [
    "remote-cache-server",
    "run",
    "--github-actions",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
    [
      "VP_RUN_INTERNAL_HIDE_PENDING_UPLOADS",
      "1",
    ],
  ] },
  [
    "vtt",
    "write-file",
    "src/a.txt",
    "2",
  ],
  { argv = [
    "remote-cache-server",
    "run",
    "--github-actions",
    "vt",
    "run",
    "build",
  ], envs = [
    [
      "VP_REMOTE_CACHE",
      "read-write",
    ],
    [
      "VP_RUN_INTERNAL_HIDE_PENDING_UPLOADS",
      "1",
    ],
  ] },
  [
    "remote-cache-server",
    "expire-entry",
    "2",
  ],
  [
    "vt",
    "cache",
    "clean",
  ],
  { argv = [
    "remote-cache-server",
    "run",
    "vt",
    "run",
    "build",
  ], comment = "The expired entry isn't fetched, and the miss is explained against the newest entry that hasn't expired." },
  [
    "vtt",
    "write-file",
    "src/a.txt",
    "1",
  ],
  { argv = [
    "remote-cache-server",
    "run",
    "vt",
    "run",
    "build",
  ], comment = "The entry for 1 hasn't expired." },
  [
    "remote-cache-server",
    "expire-entry",
    "1",
  ],
  [
    "vt",
    "cache",
    "clean",
  ],
  { argv = [
    "remote-cache-server",
    "run",
    "vt",
    "run",
    "build",
  ], comment = "Once every entry of the key has expired, the fetch finds nothing, not even a fallback." },
  [
    "remote-cache-server",
    "stop",
  ],
]

