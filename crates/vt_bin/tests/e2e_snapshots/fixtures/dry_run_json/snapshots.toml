[[e2e]]
name = "cache_statuses"
comment = """
Each step's `cache` shows what a dry run found. Durations vary, and `vtt` is outside the workspace, at an absolute path, so both are redacted.
"""
steps = [
  { argv = [
    "vt",
    "run",
    "--dry-run",
    "--json",
    "build",
  ], comment = "Nothing cached yet. In a terminal, the document is indented.", redact = { '"\$schema": "[^"]*"' = '"$$schema": "<schema>"', '"program": "[^"]*"' = '"program": "<vtt>"' } },
  [
    "vt",
    "run",
    "build",
  ],
  { argv = [
    "vtt",
    "pipe-stdout",
    "--",
    "vt",
    "run",
    "--dry-run",
    "--json",
    "build",
  ], comment = "A hit. Captured, the document is on one line.", redact = { '"\$schema":"[^"]*"' = '"$$schema":"<schema>"', '"program":"[^"]*"' = '"program":"<vtt>"', '"durationMs":\d+' = '"durationMs":<ms>' } },
  [
    "vtt",
    "write-file",
    "a.txt",
    "changed",
  ],
  { argv = [
    "vtt",
    "pipe-stdout",
    "--",
    "vt",
    "run",
    "--dry-run",
    "--json",
    "build",
  ], comment = "One file changed. Without `-v`, the file check stops there, so the list may be partial.", redact = { '"\$schema":"[^"]*"' = '"$$schema":"<schema>"', '"program":"[^"]*"' = '"program":"<vtt>"', '"durationMs":\d+' = '"durationMs":<ms>' } },
  [
    "vtt",
    "write-file",
    "b.txt",
    "changed",
  ],
  { argv = [
    "vtt",
    "pipe-stdout",
    "--",
    "vt",
    "run",
    "--dry-run",
    "--json",
    "-v",
    "build",
  ], comment = "With `-v`, every changed file is listed, by path, and the list is complete.", redact = { '"\$schema":"[^"]*"' = '"$$schema":"<schema>"', '"program":"[^"]*"' = '"program":"<vtt>"', '"durationMs":\d+' = '"durationMs":<ms>' } },
  { argv = [
    "vtt",
    "pipe-stdout",
    "--",
    "vt",
    "run",
    "--dry-run",
    "--json",
    "uncached",
  ], comment = "Caching is off for this task.", redact = { '"\$schema":"[^"]*"' = '"$$schema":"<schema>"', '"program":"[^"]*"' = '"program":"<vtt>"' } },
  { argv = [
    "vtt",
    "pipe-stdout",
    "--",
    "vt",
    "run",
    "--dry-run",
    "--json",
    "other",
  ], envs = [
    [
      "VP_REMOTE_CACHE_URL",
      "http://127.0.0.1:0/projects/test",
    ],
  ], comment = "Nothing is cached locally, and the remote cache can't be read: nothing can listen on port 0.", redact = { '"\$schema":"[^"]*"' = '"$$schema":"<schema>"', '"program":"[^"]*"' = '"program":"<vtt>"' } },
  { argv = [
    "vtt",
    "pipe-stdout",
    "--",
    "vt",
    "run",
    "--dry-run",
    "--json",
    "--filter",
    "missing",
    "build",
  ], comment = "No package matched, so the plan is empty.", redact = { '"\$schema":"[^"]*"' = '"$$schema":"<schema>"', '"program":"[^"]*"' = '"program":"<vtt>"' } },
]

[[e2e]]
name = "errors"
comment = """
Errors go to stderr, and nothing is printed to stdout.
"""
steps = [
  { argv = [
    "vt",
    "run",
    "--json",
    "build",
  ], comment = "With a task, `--json` requires `--dry-run`." },
  # clap names the binary in its usage line by the path it was run from,
  # which is `vt.exe` on Windows.
  { argv = [
    "vt",
    "run",
    "--dry-run",
    "--json",
    "--log",
    "labeled",
    "build",
  ], comment = "`--json` conflicts with `--log`.", redact = { 'Usage: vt\.exe ' = 'Usage: vt ' } },
  { argv = [
    "vt",
    "run",
    "--dry-run",
    "--json",
    "typo",
  ], comment = "A task that isn't found is an error, not a task list." },
]

[[e2e]]
name = "nested_plan"
comment = """
A nested `vt run` is a step with the plan of that run.
"""
steps = [
  [
    "vt",
    "run",
    "build",
  ],
  { argv = [
    "vtt",
    "pipe-stdout",
    "--",
    "vt",
    "run",
    "--dry-run",
    "--json",
    "nested",
  ], redact = { '"\$schema":"[^"]*"' = '"$$schema":"<schema>"', '"program":"[^"]*"' = '"program":"<vtt>"', '"durationMs":\d+' = '"durationMs":<ms>' } },
]

[[e2e]]
name = "unknown"
comment = """
A step that would be a hit or changed is `unknown` when a step it waits on would write files first: by running, or by being a hit that restores outputs. The text output doesn't show it.
"""
steps = [
  [
    "vt",
    "run",
    "after-emit",
  ],
  { argv = [
    "vtt",
    "pipe-stdout",
    "--",
    "vt",
    "run",
    "--dry-run",
    "--json",
    "after-emit",
  ], comment = "`emit` is a hit that restores `dist/out.txt`, so `after-emit` is unknown.", redact = { '"\$schema":"[^"]*"' = '"$$schema":"<schema>"', '"program":"[^"]*"' = '"program":"<vtt>"', '"durationMs":\d+' = '"durationMs":<ms>' } },
  [
    "vt",
    "run",
    "after-build",
  ],
  { argv = [
    "vtt",
    "pipe-stdout",
    "--",
    "vt",
    "run",
    "--dry-run",
    "--json",
    "after-build",
  ], comment = "`build` has no outputs, so `after-build` stays a hit.", redact = { '"\$schema":"[^"]*"' = '"$$schema":"<schema>"', '"program":"[^"]*"' = '"program":"<vtt>"', '"durationMs":\d+' = '"durationMs":<ms>' } },
  [
    "vt",
    "run",
    "emit-then-print",
  ],
  { argv = [
    "vtt",
    "pipe-stdout",
    "--",
    "vt",
    "run",
    "--dry-run",
    "--json",
    "emit-then-print",
  ], comment = "The first step restores outputs, so the step after it is unknown.", redact = { '"\$schema":"[^"]*"' = '"$$schema":"<schema>"', '"program":"[^"]*"' = '"program":"<vtt>"', '"durationMs":\d+' = '"durationMs":<ms>' } },
  [
    "vt",
    "run",
    "nested-then-print",
  ],
  { argv = [
    "vtt",
    "pipe-stdout",
    "--",
    "vt",
    "run",
    "--dry-run",
    "--json",
    "nested-then-print",
  ], comment = "The nested plan restores outputs, so the step after it is unknown.", redact = { '"\$schema":"[^"]*"' = '"$$schema":"<schema>"', '"program":"[^"]*"' = '"program":"<vtt>"', '"durationMs":\d+' = '"durationMs":<ms>' } },
  { argv = [
    "vt",
    "run",
    "--dry-run",
    "after-emit",
  ], comment = "The text shows today's check." },
]
