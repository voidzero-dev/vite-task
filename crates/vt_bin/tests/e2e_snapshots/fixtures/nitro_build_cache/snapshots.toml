[[e2e]]
name = "nitro_build_restores_traced_dependency_links"
comment = """
A real Nitro server build traces `dep-a` and `dep-b`, which depend on different versions of `tslib` (small stand-ins committed in the fixture's `node_modules`). nf3 writes each version under `.output/server/node_modules/.nf3/tslib@<version>`, links `node_modules/tslib` to the hoisted one, and links each package's `node_modules/tslib` to the one it needs. A cache hit restores those links as links, so each package still resolves its own version from the restored output. On Windows, nf3 creates junctions, whose targets are absolute paths.
"""
ignore = true
steps = [
  { argv = [
    "vt",
    "run",
    "build",
  ], comment = "first run — cache miss, Nitro builds .output/" },
  { argv = [
    "node",
    "check.cjs",
  ], comment = "nf3 linked each package's tslib into .nf3, so each resolves its own version" },
  { argv = [
    "vtt",
    "rm",
    "-rf",
    ".output",
  ], comment = "delete .output/ to prove the restore is real" },
  { argv = [
    "vt",
    "run",
    "build",
  ], comment = "second run — cache hit, restores .output/ with its links" },
  { argv = [
    "node",
    "check.cjs",
  ], comment = "the restored output has the same links, not copies, and resolves the same versions" },
]

[[e2e]]
name = "nitro_auto_outputs_restore_links"
comment = """
The same Nitro build with automatic input and output tracking only, no `input` or `output` globs. nf3 checks each path before linking it, so the links are among the paths the task read.
"""
# Unix only for now: on Windows, nf3 makes junctions, which libuv opens for
# writing before turning them into links, so they're recorded as written there
# already.
cfg = "unix"
ignore = true
steps = [
  { argv = [
    "vt",
    "run",
    "build-auto",
  ], comment = "first run — cache miss, Nitro builds .output/" },
  [
    "node",
    "check.cjs",
  ],
  { argv = [
    "vtt",
    "rm",
    "-rf",
    ".output",
  ], comment = "remove .output/, as on a clean checkout" },
  { argv = [
    "vt",
    "run",
    "build-auto",
  ], comment = "several inputs are missing and vt names whichever it finds first, so the miss reason is redacted", redact = { 'cache miss: .*, executing' = 'cache miss: <removed input>, executing' } },
  { argv = [
    "node",
    "check.cjs",
  ], comment = "the output has the same links, not copies, and resolves the same versions" },
]
