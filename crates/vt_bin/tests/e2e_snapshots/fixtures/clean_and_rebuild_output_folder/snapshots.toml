[[e2e]]
name = "clean_and_rebuild_output_folder"
comment = """
The task reads `src/a.txt`, lists `out`, removes it, makes it again, writes `out/a.txt` and stats `out`, like a build tool cleaning its output folder before writing a new one.
"""
steps = [
  [
    "vt",
    "run",
    "build",
  ],
  { argv = [
    "vtt",
    "replace-file-content",
    "src/a.txt",
    "v1",
    "v2",
  ], comment = "change an input, so the next run cleans and rebuilds the existing `out`" },
  [
    "vt",
    "run",
    "build",
  ],
  { argv = [
    "vtt",
    "rm",
    "-r",
    "out",
  ], comment = "remove the output folder, as on a clean checkout" },
  [
    "vt",
    "run",
    "build",
  ],
  [
    "vtt",
    "stat-file",
    "out/a.txt",
  ],
]
