# pnpm's changed-since `--filter "[<since>]"` selector, against a real git
# repository created in the staged fixture. Dependencies: app -> lib -> utils.

[[e2e]]
name = "changed_leaf_selects_it_and_its_dependents"
comment = """
A commit changes only the leaf `@test/utils`. `...[HEAD~1]` selects it and every package that depends on it, and builds them in dependency order.
"""
steps = [
  [
    "git",
    "-c",
    "init.defaultBranch=main",
    "init",
    "-q",
  ],
  [
    "git",
    "-c",
    "core.autocrlf=false",
    "add",
    "-A",
  ],
  [
    "git",
    "-c",
    "user.name=test",
    "-c",
    "user.email=test@example.com",
    "-c",
    "commit.gpgsign=false",
    "commit",
    "-q",
    "--no-verify",
    "-m",
    "init",
  ],
  [
    "vtt",
    "replace-file-content",
    "packages/utils/src/index.js",
    "export {};",
    "export const changed = 1;",
  ],
  [
    "git",
    "-c",
    "core.autocrlf=false",
    "add",
    "-A",
  ],
  [
    "git",
    "-c",
    "user.name=test",
    "-c",
    "user.email=test@example.com",
    "-c",
    "commit.gpgsign=false",
    "commit",
    "-q",
    "--no-verify",
    "-m",
    "change",
  ],
  [
    "vt",
    "run",
    "--filter",
    "...[HEAD~1]",
    "build",
  ],
  [
    "vt",
    "run",
    "--filter",
    "[HEAD~1]",
    "build",
  ],
]

[[e2e]]
name = "uncommitted_change_counts"
comment = """
An uncommitted change to a tracked file counts as a change since `HEAD`.
"""
steps = [
  [
    "git",
    "-c",
    "init.defaultBranch=main",
    "init",
    "-q",
  ],
  [
    "git",
    "-c",
    "core.autocrlf=false",
    "add",
    "-A",
  ],
  [
    "git",
    "-c",
    "user.name=test",
    "-c",
    "user.email=test@example.com",
    "-c",
    "commit.gpgsign=false",
    "commit",
    "-q",
    "--no-verify",
    "-m",
    "init",
  ],
  [
    "vtt",
    "replace-file-content",
