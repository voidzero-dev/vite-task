[[e2e]]
name = "preexisting_ld_preload"
# Tests user-supplied `LD_PRELOAD` interposition alongside fspy on glibc-Linux
# (`vt_preload_test_lib` is built as a cdylib for glibc).
cfg = 'all(target_os = "linux", target_env = "gnu")'
comment = """
Reproduces #340 and verifies that fspy preserves a user-supplied `LD_PRELOAD` untouched. Because Linux tracking runs at the kernel syscall boundary via `fspy_preload_linux` (`SIGSYS`), any call short-circuited in userspace by the user's preload never issues a kernel syscall and remains invisible to fspy — what the OS actually executed is what fspy records.

`vt_preload_test_lib` (built as a cdylib artifact dep) intercepts `open`/`openat` and short-circuits any path containing the marker `preload_test_short_circuit`, returning `ENOENT` without forwarding. Every other path is forwarded via `RTLD_NEXT` so fspy still observes the real syscall.

The `read` task prints two files. `real.txt` goes through the full interposer chain and is tracked as an input. `preload_test_short_circuit.txt` is short-circuited by the user preload; fspy never sees it and does not track it. Modifying the short-circuited file must therefore be a cache hit; modifying the real file must be a miss.
"""
steps = [
  { argv = [
    "vt",
    "run",
    "read",
  ], envs = [
    [
      "LD_PRELOAD",
      "<PRELOAD_TEST_LIB_PATH>",
    ],
  ], comment = "cache miss: real.txt tracked; short-circuited file reported not found" },
  { argv = [
    "vt",
    "run",
    "read",
  ], envs = [
    [
      "LD_PRELOAD",
      "<PRELOAD_TEST_LIB_PATH>",
    ],
  ], comment = "cache hit" },
  { argv = [
    "vtt",
    "write-file",
    "preload_test_short_circuit.txt",
    "modified short-circuited content",
  ], comment = "modify the untracked (short-circuited) file" },
  { argv = [
    "vt",
    "run",
    "read",
  ], envs = [
    [
      "LD_PRELOAD",
      "<PRELOAD_TEST_LIB_PATH>",
    ],
  ], comment = "still cache hit: short-circuited access was never tracked" },
  { argv = [
    "vtt",
    "write-file",
    "real.txt",
    "modified real content",
  ], comment = "modify the tracked file" },
  { argv = [
    "vt",
    "run",
    "read",
  ], envs = [
    [
      "LD_PRELOAD",
      "<PRELOAD_TEST_LIB_PATH>",
    ],
  ], comment = "cache miss: tracked input changed" },
]
