[[e2e]]
name = "missing_task_reports_unreached_config_error"
comment = """
Bug: `packages/broken/vite-task.json` sets `cache`, which only the workspace root config may set. `vt run build` in `packages/app` never reads `@test/broken`'s config, but `vt run ship`, a task `@test/app` doesn't define, does: the run falls back to listing every task, so it fails with `@test/broken`'s error instead of saying `Task "ship" not found`. With `--parallel`, which skips that fallback, the same command gets the not-found error.
"""
cwd = "packages/app"
steps = [
  { argv = [
    "vt",
    "run",
    "build",
  ], comment = "never reads @test/broken's config" },
  { argv = [
    "vtt",
    "pipe-stdout",
    "--",
    "vt",
    "run",
    "ship",
  ], comment = "bug: fails with @test/broken's error instead of `Task \"ship\" not found.`" },
  { argv = [
    "vt",
    "run",
    "ship",
  ], comment = "bug: in a terminal, fails with the same error instead of showing the task selector" },
  { argv = [
    "vt",
    "run",
    "--parallel",
    "ship",
  ], comment = "the same task name without the fallback is reported as not found" },
]
