[[e2e]]
name = "pnpm_modules_manifest_content_ignored"
comment = """
Only whether pnpm's `node_modules/.modules.yaml` exists is part of the fingerprint, so changing its content keeps the cache hit. Removing it is a cache miss.
"""
steps = [
  [
    "vtt",
    "mkdir",
    "-p",
    "node_modules",
  ],
  [
    "vtt",
    "cp",
    "modules.json",
    "node_modules/.modules.yaml",
  ],
  { argv = [
    "vt",
    "run",
    "read-manifest",
  ], comment = "cache miss" },
  { argv = [
    "vtt",
    "replace-file-content",
    "node_modules/.modules.yaml",
    "Thu, 08 Oct 2026 08:18:18 GMT",
    "Fri, 09 Oct 2026 03:13:58 GMT",
  ], comment = "reinstall: new prunedAt" },
  { argv = [
    "vtt",
    "replace-file-content",
    "node_modules/.modules.yaml",
    "pnpm@11.24.0",
    "pnpm@11.25.0",
  ], comment = "install with another pnpm version: new packageManager" },
  { argv = [
    "vt",
    "run",
    "read-manifest",
  ], comment = "cache hit" },
  { argv = [
    "vtt",
    "rm",
    "node_modules/.modules.yaml",
  ], comment = "remove the manifest" },
  { argv = [
    "vt",
    "run",
    "read-manifest",
  ], comment = "cache miss: input removed" },
]
