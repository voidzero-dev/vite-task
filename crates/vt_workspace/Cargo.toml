[package]
name = "vt_workspace"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
petgraph = { workspace = true, features = ["serde-1"] }
rustc-hash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# use `preserve_order` feature to preserve the order of the fields in `package.json`
serde_json = { workspace = true, features = ["preserve_order"] }
serde_norway = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
usage = { workspace = true, features = ["spec"] }
vec1 = { workspace = true, features = ["smallvec-v1"] }
vt_glob = { workspace = true }
vt_path = { workspace = true }
vt_str = { workspace = true }
wax = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
usage = { workspace = true, features = ["test"] }

[lints]
workspace = true

[lib]
doctest = false
