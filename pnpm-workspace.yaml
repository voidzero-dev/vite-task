packages:
  - .
  - packages/tools
  - packages/vite-task-client

allowBuilds:
  '@playwright/browser-chromium': true
  bun: true
  deno: true

minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'

catalog:
  '@anthropic-ai/sandbox-runtime': 0.0.76
  '@fastify/busboy': 3.2.2
  '@openai/codex': 0.154.0
  '@tsconfig/strictest': ^2.0.8
  '@types/node': 25.0.3
  '@playwright/browser-chromium': 1.63.0
  '@vitest/browser-playwright': 5.0.1
  bun: 1.4.2
  cbor-edn: 0.2.2
  cbor2: 1.12.0
  cross-env: ^10.1.0
  deno: 2.9.6
  husky: ^9.1.7
  lint-staged: ^17.0.0
  oxfmt: 0.68.0
  oxlint: ^1.55.0
  oxlint-tsgolint: ^7.0.0
  # Playwright 1.52 pins the browser package to Chromium 136.
  playwright: 1.63.0
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0
  vitest: 5.0.1

catalogMode: prefer
overrides:
  playwright: 1.63.0
  vite@*: 'catalog:'
  # The e2e harness symlinks packages/tools' `vite` binary into fixtures to
  # exercise the real vite-task-client integration. The global `vite@*` override
  # above routes vite to the Vite+ toolchain fork, which does not carry the
  # integration — so scope vite-task-tools' `vite` to a real upstream build.
  vite-task-tools>vite: 8.3.0
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
