packages:
  - .
  - packages/tools
  - packages/vite-task-client

catalog:
  '@tsconfig/strictest': ^2.0.8
  '@types/node': 25.0.3
  husky: ^9.1.7
  lint-staged: ^17.0.0
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest

catalogMode: prefer
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
